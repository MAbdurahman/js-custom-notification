<!doctype html>
<html dir='ltr' lang='en-US'>
<head>
    <meta charset='UTF-8'>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <meta content='Mahdi Abdurrahman' name='author'>
    <meta content='Custom notification with HTML, CSS, and JavaScript'
          name='description'>
    <meta content='HTML, CSS, JavaScript, web development, programming, custom notification,'
          name='keywords'>
    <title>js-custom-notification</title>
    <!-- google fonts -->
    <link href='https://fonts.googleapis.com' rel='preconnect'>
    <link crossorigin href='https://fonts.gstatic.com' rel='preconnect'>
    <link href='https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap'
          rel='stylesheet'>
    <!-- fontawesome -->
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css'
          rel='stylesheet'>
    <!-- normalize css -->
    <link href='./css/normalize.css' rel='stylesheet'>
    <!-- main styles -->
    <link href='./css/styles.css' rel='stylesheet'/>
    <!-- main scripts -->
    <script defer src='./js/scripts.js'></script>
</head>
<body>
<!-- preloader -->
<div class='preloader' id='preloader'>
    <img alt='cube animating' class='preloader-gif' id='preloader-gif'
         src='./img/preloader.gif'>
</div>
<!-- main content -->
<main class='main utils-container'>
    <div class='button-container'>
        <button class='btn success' data-type='success'>Success</button>
        <button class='btn error' data-type='error'>Error</button>
        <button class='btn warn' data-type='warn'>Warn</button>
        <button class='btn inform' data-type='inform'>Inform</button>
    </div>
    <div class='toast-container'></div>
</main>
</body>
</html>
